<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dracula and Alucard</title>
  </head>
  <body>
    <main>
      <h1>Vampire ledger</h1>
      <section aria-label="vampire ages">
        <p id="result"></p>
      </section>
    </main>

    <script>
      const vampires = [
        {
          name: "Dracula",
          birthDate: 1428,
          deathDate: 1476,
          location: "Transylvania",
        },
        {
          name: "Alucard",
          birthDate: 1458,
          deathDate: 1510,
          location: "Wallachia",
        },
      ];

      const summary = vampires
        .map(
          (vampire) =>
            `${vampire.name}: ${vampire.deathDate - vampire.birthDate}`,
        )
        .join(" | ");

      document.querySelector("#result").textContent = summary;
    </script>
  </body>
</html>
